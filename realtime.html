<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="黄金实时行情">
<link rel="apple-touch-icon" href="app-icon.png">
<title>贵金属实时行情 | 黄金 CFTC COT</title>
<script src="echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: auto; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; color: #2c3e50; padding: 20px;
  }
  .container { width: 100%; max-width: 960px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 22px; }
  .navlink { font-size: 13px; color: #2980b9; text-decoration: none; white-space: nowrap; }
  .navlink:hover { text-decoration: underline; }
  /* 三页统一的顶部导航胶囊 */
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .navpill {
    font-size: 13px; color: #fff; background: #f39c12; padding: 7px 16px;
    border-radius: 6px; text-decoration: none; white-space: nowrap;
  }
  .navpill:hover { background: #e67e22; }
  .navpill.active { background: #d35400; cursor: default; }
  .status { margin-left: auto; font-size: 12px; color: #95a5a6; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer;
    border: 2px solid transparent; transition: border-color .15s;
  }
  .card.active { border-color: #f39c12; }
  .card .name { font-size: 13px; color: #7f8c8d; margin-bottom: 2px; }
  .card .price { font-size: 24px; font-weight: 600; }
  .card .change { font-size: 12px; margin-top: 2px; }
  .card .time { font-size: 10px; color: #95a5a6; margin-top: 6px; }
  .up { color: #c0392b; } .down { color: #27ae60; } .gray { color: #95a5a6; }

  .chart-wrap {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .chart-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .chart-title h2 { font-size: 16px; }
  .chart-title .ohlc { font-size: 12px; color: #7f8c8d; }
  .chart-title .ohlc b { color: #2c3e50; }
  #chart { width: 100%; height: 520px; }
  .approx-note { font-size: 11px; color: #e67e22; margin-top: 6px; display: none; }

  .note { font-size: 12px; color: #95a5a6; line-height: 1.7; margin-top: 12px; }

  @media (max-width: 768px) {
    body { padding: 12px; }
    h1 { font-size: 18px; }
    #chart { height: 440px; }
    .card .price { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>贵金属实时行情</h1>
    <div class="navrow">
      <a class="navpill" href="dashboard.html">持仓看板</a>
      <a class="navpill" href="dashboard_ta.html">技术分析</a>
      <span class="navpill active">实时行情</span>
    </div>
    <span class="status" id="status">加载中...</span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="chart-wrap">
    <div class="chart-title">
      <h2 id="chartName">--</h2>
      <span class="ohlc" id="chartOhlc"></span>
    </div>
    <div id="chart"></div>
    <div class="approx-note" id="approxNote">注: 本品种历史K线暂时用 COMEX 黄金形态按实时比价折算显示, GitHub Actions 抓到官方源数据后自动切换为真实数据。</div>
  </div>

  <div class="note">
    每 10 秒自动刷新实时报价并更新当前 K线柱; 点击上方卡片切换品种。
    伦敦金/COMEX/上金 T+D 实时报价均来自东方财富行情接口; 历史K线由 GitHub Actions 定时生成
    (<code>data/rt_charts.js</code>)。MACD(12, 26, 9), 柱 = 2×(DIF−DEA)。
  </div>
</div>

<script>
const AUTO_REFRESH_SEC = 10;
const statusEl = document.getElementById('status');
const cardsEl = document.getElementById('cards');
const chartNameEl = document.getElementById('chartName');
const chartOhlcEl = document.getElementById('chartOhlc');
const approxNoteEl = document.getElementById('approxNote');
const INSTRUMENTS = {
  xau: { label: '伦敦金 XAU/USD', unit: '美元/盎司', digits: 2 },
  gc:  { label: 'COMEX 黄金 GC',  unit: '美元/盎司', digits: 2 },
  sge: { label: '上海黄金 T+D',   unit: '元/克',    digits: 2 },
};
let currentKey = 'xau';
let chartsData = null;    // window.RT_CHARTS
window.liveQuotes = {};

if (typeof echarts === 'undefined') {
  document.getElementById('chart').innerHTML =
    '<div style="padding:60px 20px;text-align:center;color:#95a5a6;font-size:13px">图表组件加载失败，请强制刷新页面</div>';
  throw new Error('echarts failed to load');
}
const chart = echarts.init(document.getElementById('chart'));
const COLORS = {
  up: '#e74c3c', down: '#27ae60',
  dif: '#e74c3c', dea: '#2980b9', macdUp: '#e74c3c', macdDn: '#27ae60',
  mark: '#f39c12',
  ma5: '#e74c3c', ma10: '#f39c12', ma20: '#2980b9', ma60: '#27ae60',
  ma100: '#8e44ad',
};

function fmt(n, digits) {
  if (n == null || isNaN(n)) return '--';
  return n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

// ---------------- 报价卡片 ----------------
function renderCards() {
  cardsEl.innerHTML = Object.keys(INSTRUMENTS).map(k => {
    const q = window.liveQuotes[k];
    const cls = !q || q.change == null ? 'gray' : (q.change >= 0 ? 'up' : 'down');
    const sign = !q || q.change == null ? '' : (q.change >= 0 ? '+' : '');
    const chg = !q || q.change == null ? '--'
      : `${sign}${fmt(q.change, 2)} (${sign}${fmt(q.change_pct, 2)}%)`;
    return `<div class="card ${k === currentKey ? 'active' : ''}" data-key="${k}">
      <div class="name">${INSTRUMENTS[k].label}</div>
      <div class="price ${cls}">${q ? fmt(q.last, 2) : '--'}</div>
      <div class="change ${cls}">${chg} <span class="gray">${INSTRUMENTS[k].unit}</span></div>
      <div class="time">${q ? (q.date + ' ' + q.time) : '等待数据...'} · 点击切换图表</div>
    </div>`;
  }).join('');
  cardsEl.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', () => { currentKey = c.dataset.key; renderCards(); renderChart(); });
  });
}

// ---------------- 历史K线 + 实时合成当日bar ----------------
function displayRows(key) {
  const pack = (chartsData || {})[key];
  const rows = (pack && pack.rows) ? pack.rows.slice() : [];
  const q = window.liveQuotes[key];
  if (q && q.last != null) {
    const today = q.date;
    const live = [today, q.open ?? q.last, q.last,
                  Math.max(q.high ?? q.last, q.last), Math.min(q.low ?? q.last, q.last)];
    if (rows.length && rows[rows.length - 1][0] === today) rows[rows.length - 1] = live;
    else rows.push(live);
  }
  return rows;
}

// ---------------- MACD / MA ----------------
function calcEMA(vals, n) {
  const k = 2 / (n + 1); const out = []; let e = null;
  for (let i = 0; i < vals.length; i++) {
    e = e === null ? vals[i] : vals[i] * k + e * (1 - k);
    out.push(e);
  }
  return out;
}
function calcMACD(closes, fast = 12, slow = 26, sig = 9) {
  const ef = calcEMA(closes, fast), es = calcEMA(closes, slow);
  const dif = closes.map((_, i) => ef[i] - es[i]);
  const dea = calcEMA(dif, sig);
  return { dif, dea, hist: dif.map((d, i) => (d - dea[i]) * 2) };
}
function calcMA(closes, n) {
  const out = []; let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    if (i >= n) sum -= closes[i - n];
    out.push(i >= n - 1 ? +(sum / n).toFixed(2) : null);
  }
  return out;
}

// ---------------- 渲染 K线 + MACD ----------------
function renderChart() {
  const rows = displayRows(currentKey);
  const pack = (chartsData || {})[currentKey];
  chartNameEl.textContent = INSTRUMENTS[currentKey].label + ' 日K';
  approxNoteEl.style.display = (pack && pack.approx) ? 'block' : 'none';
  if (!rows.length) {
    chart.clear();
    chart.setOption({
      title: { text: '历史K线生成中\n(GitHub Actions 下一轮更新后显示)', left: 'center', top: 'middle',
               textStyle: { fontSize: 14, color: '#95a5a6', fontWeight: 'normal' } }
    });
    chartOhlcEl.textContent = '';
    return;
  }
  // 只显示最近 180 根, 避免图过宽
  const view = rows.slice(-180);
  const dates = view.map(r => r[0]);
  const kline = view.map(r => [r[1], r[2], r[3], r[4]]);  // 开 收 高 低 (ECharts candlestick 顺序)
  const closes = view.map(r => r[2]);
  const { dif, dea, hist } = calcMACD(closes);
  const mas = {
    'MA5': calcMA(closes, 5), 'MA10': calcMA(closes, 10),
    'MA20': calcMA(closes, 20), 'MA60': calcMA(closes, 60),
    'MA100': calcMA(closes, 100),
  };
  const last = closes[closes.length - 1];
  const digits = INSTRUMENTS[currentKey].digits;

  // 标题 OHLC 摘要
  const lb = view[view.length - 1];
  chartOhlcEl.innerHTML =
    `开 <b>${fmt(lb[1], digits)}</b> 收 <b>${fmt(lb[2], digits)}</b> ` +
    `高 <b style="color:#c0392b">${fmt(lb[3], digits)}</b> 低 <b style="color:#27ae60">${fmt(lb[4], digits)}</b>`;

  const upColor = COLORS.up, downColor = COLORS.down;
  const maSeries = Object.keys(mas).map(name => ({
    name, type: 'line', data: mas[name], showSymbol: false, z: 3,
    lineStyle: { width: 1.1, color: COLORS[name.toLowerCase()] },
    itemStyle: { color: COLORS[name.toLowerCase()] },
  }));
  chart.setOption({
    animation: false,
    legend: {
      top: 0, left: 8, itemWidth: 14, itemHeight: 8, textStyle: { fontSize: 10 },
      data: Object.keys(mas),
      formatter: name => {
        const arr = mas[name];
        const v = arr[arr.length - 1];
        return v == null ? name : `${name} ${v.toFixed(1)}`;
      },
    },
    grid: [
      { left: 70, right: 20, top: 30, height: '58%' },
      { left: 70, right: 20, top: '72%', height: '18%' },
    ],
    xAxis: [
      { type: 'category', data: dates, gridIndex: 0, axisLabel: { fontSize: 10 },
        axisTick: { show: false } },
      { type: 'category', data: dates, gridIndex: 1, axisLabel: { fontSize: 10 } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, position: 'left',
        axisLabel: { fontSize: 10, formatter: v => v.toFixed(0) },
        splitLine: { lineStyle: { color: '#eee' } } },
      { scale: true, gridIndex: 1, position: 'left',
        axisLabel: { fontSize: 9 }, splitLine: { show: false } },
    ],
    dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 55, end: 100 }],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' },
      formatter: ps => {
        const i = ps[0].dataIndex;
        const v = view[i];
        const c = v[2] >= v[1] ? upColor : downColor;
        return `${v[0]}<br/>开 ${fmt(v[1], digits)} 收 <b style="color:${c}">${fmt(v[2], digits)}</b><br/>` +
               `高 ${fmt(v[3], digits)} 低 ${fmt(v[4], digits)}<br/>` +
               `<span style="font-size:10px;color:#95a5a6">MACD DIF ${fmt(dif[i], 2)} DEA ${fmt(dea[i], 2)}</span>`;
      },
    },
    series: [
      {
        name: '日K', type: 'candlestick', data: kline,
        itemStyle: {
          color: upColor, color0: downColor,
          borderColor: upColor, borderColor0: downColor,
        },
        markLine: {
          silent: true, symbol: 'none', animation: false,
          lineStyle: { color: COLORS.mark, type: 'dashed', width: 1 },
          label: { position: 'insideEndTop', fontSize: 10, formatter: fmt(last, digits) },
          data: [{ yAxis: last }],
        },
      },
      ...maSeries,
      { name: 'DIF', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: dif,
        showSymbol: false, lineStyle: { width: 1.2, color: COLORS.dif } },
      { name: 'DEA', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: dea,
        showSymbol: false, lineStyle: { width: 1.2, color: COLORS.dea } },
      { name: 'MACD', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: hist, barMaxWidth: 5,
        itemStyle: { color: p => (p.value >= 0 ? COLORS.macdUp : COLORS.macdDn) } },
    ],
  }, true);
}

// ---------------- 东方财富实时行情 JSONP (三品种一次请求) ----------------
// 新浪 hq.sinajs.cn 校验 Referer(只允许 *.sina.com.cn), 跨域 <script> 引用会被 403,
// 因此浏览器端统一改用东方财富 ulist JSONP (支持 cb 回调, 无需 token)。
// ulist 字段: f2=最新价 f3=涨跌幅% f4=涨跌额 f5=成交量 f6=成交额
//             f12=代码 f14=名称 f15=最高 f16=最低 f17=今开 f18=昨收
const EM_SECIDS = { '122.XAU': 'xau', '101.GC00Y': 'gc', '118.AUTD': 'sge' };
const EM_NAMES = { xau: '伦敦金 XAU/USD', gc: 'COMEX 黄金 GC', sge: '上海黄金 T+D AUTD' };

function normPrice(key, v) {
  if (v == null) return null;
  v = parseFloat(v);
  if (isNaN(v) || v === 0) return null;   // 0 表示未开盘/字段无效
  if ((key === 'xau' || key === 'gc') && v > 10000) v /= 100;   // 部分接口原值放大100倍
  if (key === 'sge' && v > 100000) v /= 100;
  return v;
}

function emQuoteCallback(payload) {
  const list = (payload && payload.data && payload.data.diff) || [];
  const q = window.liveQuotes;
  const today = new Date().toISOString().slice(0, 10);
  let got = 0;
  list.forEach(d => {
    const key = EM_SECIDS[d['f12']];
    if (!key) return;
    const last = normPrice(key, d['f2']);
    if (last == null) return;
    const prev = normPrice(key, d['f18']);
    const change = (d['f4'] != null && parseFloat(d['f4']) !== 0)
      ? +parseFloat(d['f4']).toFixed(2)
      : (prev != null ? +(last - prev).toFixed(2) : null);
    const change_pct = (d['f3'] != null && parseFloat(d['f3']) !== 0)
      ? +parseFloat(d['f3']).toFixed(2) : null;
    q[key] = {
      symbol: d['f12'], name: EM_NAMES[key],
      last: last, high: normPrice(key, d['f15']), low: normPrice(key, d['f16']),
      open: normPrice(key, d['f17']), prev_close: prev,
      volume: d['f5'], amount: d['f6'],
      change: change, change_pct: change_pct,
      time: new Date().toLocaleTimeString('zh-CN'), date: today
    };
    got++;
  });
  if (got) {
    renderCards(); renderChart();
    updateStatus('实时行情已更新 (' + got + '/3) · ' + new Date().toLocaleTimeString('zh-CN'));
  } else {
    updateStatus('实时接口返回空数据, 显示静态快照');
  }
}

function refreshQuotes() {
  const fields = 'f2,f3,f4,f5,f6,f12,f14,f15,f16,f17,f18';
  const s = document.createElement('script');
  s.referrerPolicy = 'no-referrer';   // 东方财富校验 Referer, 必须不带来源
  s.src = 'https://push2.eastmoney.com/api/qt/ulist.np/get?secids=122.XAU,101.GC00Y,118.AUTD'
        + '&fields=' + fields + '&cb=emQuoteCallback&t=' + Date.now();
  s.onerror = () => updateStatus('实时行情接口失败, 显示静态快照');
  document.head.appendChild(s);
}

// ---------------- 静态历史K线 + 静态快照 ----------------
function loadStatic() {
  // 历史K线
  const sc = document.createElement('script');
  sc.src = 'data/rt_charts.js?t=' + Date.now();
  sc.onload = () => {
    chartsData = window.RT_CHARTS || null;
    renderChart();
  };
  sc.onerror = () => { chartsData = null; renderChart(); };
  document.head.appendChild(sc);
  // 静态报价快照
  const sq = document.createElement('script');
  sq.src = 'data/rt_quotes.js?t=' + Date.now();
  sq.onload = () => {
    const d = window.RT_QUOTES;
    if (d && d.quotes) {
      window.liveQuotes = Object.assign({}, d.quotes);
      renderCards(); renderChart();
      updateStatus('静态快照 ' + d.updated + ' · 实时刷新中...');
    }
  };
  document.head.appendChild(sq);
}

function updateStatus(text) { statusEl.textContent = text; }

window.addEventListener('resize', () => chart.resize());
loadStatic();
refreshQuotes();
setInterval(refreshQuotes, AUTO_REFRESH_SEC * 1000);
</script>
</body>
</html>
