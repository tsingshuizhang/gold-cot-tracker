name: GoldCotTracker
options:
  bundleIdPrefix: com.tsingshuizhang
  deploymentTarget:
    iOS: "17.0"
targets:
  GoldCotTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: MQM879TDKM
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 黄金COT看板
        UILaunchStoryboardName: ""
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GoldCotTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GoldCotTracker
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tsingshuizhang.GoldCotTrackerUITests
        TEST_TARGET_NAME: GoldCotTracker
